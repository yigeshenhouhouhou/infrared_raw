<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IR Studio · 红外 RAW 专业调色工作台</title>
<style>
/* ==========================================================================
   Capture One / DaVinci Resolve Pro 调色工作台设计系统
   ========================================================================== */
:root {
  --bg-deep: #101114;
  --bg-app: #14161a;
  --bg-panel: #181a1f;
  --bg-panel-alt: #1d2026;
  --bg-elevated: #232730;
  --bg-hover: #2b303c;
  --bg-active: #323947;
  --bg-input: #0d0f12;

  --border-subtle: #23262f;
  --border-medium: #2f3440;
  --border-focus: #3b82f6;

  --text-pure: #ffffff;
  --text-main: #e2e4e9;
  --text-muted: #8b92a2;
  --text-dim: #545b6b;

  --accent: #3b82f6;
  --accent-glow: rgba(59, 130, 246, 0.25);
  --accent-soft: rgba(59, 130, 246, 0.12);
  
  --amber: #f59e0b;
  --amber-soft: rgba(245, 158, 11, 0.15);
  --cyan: #06b6d4;
  --danger: #ef4444;
  --success: #10b981;

  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3c4252; }

body {
  background: var(--bg-deep);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 12px;
  line-height: 1.4;
  user-select: none;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* 顶部工作条 (App Bar) */
header {
  height: 42px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 16px;
  flex-shrink: 0;
  z-index: 10;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-mark {
  width: 20px;
  height: 20px;
  border-radius: 5px;
  background: linear-gradient(135deg, #ef4444 0%, #8b5cf6 50%, #3b82f6 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.brand-mark svg { width: 12px; height: 12px; fill: #fff; }
.brand-name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.3px;
  color: var(--text-pure);
}
.brand-badge {
  font-size: 10px;
  font-family: var(--font-mono);
  background: var(--bg-elevated);
  color: var(--text-muted);
  padding: 1px 6px;
  border-radius: 3px;
  border: 1px solid var(--border-medium);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: 20px;
}
.header-meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  color: var(--text-dim);
}
.outdir-tag {
  font-family: var(--font-mono);
  background: var(--bg-deep);
  border: 1px solid var(--border-subtle);
  padding: 2px 8px;
  border-radius: 4px;
  color: var(--text-muted);
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 工作区三栏布局 */
main {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
}

/* 左侧栏：胶卷批次 (Filmstrip) */
.sidebar-left {
  width: 240px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.section-header {
  height: 34px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-panel-alt);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}
.badge-count {
  font-family: var(--font-mono);
  background: var(--bg-deep);
  color: var(--text-dim);
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 10px;
}
.filmstrip-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.drop-box {
  border: 1px dashed var(--border-medium);
  border-radius: var(--radius-md);
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  background: rgba(13, 15, 18, 0.4);
  transition: all 0.15s ease;
}
.drop-box:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.drop-box.drag-over {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 10px var(--accent-glow);
}
.drop-box svg { width: 22px; height: 22px; fill: var(--text-muted); margin-bottom: 4px; }
.drop-box .t { font-size: 11.5px; font-weight: 500; color: var(--text-main); }
.drop-box .s { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }

/* 胶卷单项卡片 */
.raw-item {
  background: var(--bg-panel-alt);
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  padding: 6px 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.12s ease;
}
.raw-item:hover {
  background: var(--bg-elevated);
  border-color: var(--border-medium);
}
.raw-item.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.raw-item.error {
  border-color: var(--danger);
  background: rgba(239, 68, 68, 0.08);
}
.raw-thumb {
  width: 36px;
  height: 36px;
  border-radius: 3px;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.raw-thumb img { width: 100%; height: 100%; object-fit: cover; }
.raw-thumb svg { width: 16px; height: 16px; fill: var(--text-dim); }
.raw-detail { flex: 1; min-width: 0; }
.raw-name {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.raw-sub {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-dim);
  margin-top: 2px;
}
.raw-sub b { color: var(--amber); font-weight: normal; }

/* 中央画廊与视口 (Canvas Viewport) */
.viewport-area {
  flex: 1;
  min-width: 0;
  background: var(--bg-deep);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* 视口工具条 */
.viewport-toolbar {
  height: 38px;
  background: rgba(24, 26, 31, 0.85);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
  z-index: 5;
}
.tool-group {
  display: flex;
  align-items: center;
  gap: 3px;
  background: var(--bg-panel-alt);
  padding: 2px 3px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
}

/* 画布主体居中 */
.viewport-canvas {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 12px;
}
.empty-guide {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: var(--text-dim);
  gap: 8px;
}
.empty-guide svg { width: 40px; height: 40px; fill: var(--text-dim); opacity: 0.4; }
.image-stage {
  position: relative;
  display: none;
  border-radius: 2px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05);
  max-width: 100%;
  max-height: 100%;
}
.image-stage.show { display: inline-flex; }
.image-stage img {
  max-width: calc(100vw - 610px);
  max-height: calc(100vh - 125px);
  display: block;
  object-fit: contain;
}
.image-stage.crosshair img { cursor: crosshair; }

/* 吸管选区指示框 */
#sel {
  position: absolute;
  border: 1.5px solid var(--cyan);
  background: rgba(6, 182, 212, 0.2);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.8), 0 0 8px rgba(6, 182, 212, 0.5);
  display: none;
  pointer-events: none;
  z-index: 10;
}

/* 对比原片与加载水印 */
.badge-compare {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(20, 22, 26, 0.85);
  border: 1px solid var(--amber);
  color: var(--amber);
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.5px;
  display: none;
  z-index: 6;
}
.badge-compare.active { display: block; }

.render-loading {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(20, 22, 26, 0.85);
  border: 1px solid var(--border-medium);
  color: var(--text-main);
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  display: none;
  align-items: center;
  gap: 6px;
  z-index: 6;
}
.render-loading.active { display: flex; }
.loading-pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 0.8s infinite alternate ease-in-out;
}
@keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }

/* 底部状态条 */
.viewport-footer {
  height: 26px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-size: 11px;
  color: var(--text-dim);
  gap: 12px;
}
.kbd {
  background: var(--bg-deep);
  border: 1px solid var(--border-medium);
  padding: 0 4px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--text-muted);
}

/* 右侧栏：专业参数控制台 (Grading Panel) */
.sidebar-right {
  width: 320px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}

/* 直方图组件 (RGB Histogram) */
.histogram-box {
  padding: 10px 12px;
  background: #111215;
  border-bottom: 1px solid var(--border-subtle);
}
.hist-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10.5px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.hist-meta .legend {
  display: flex;
  gap: 8px;
}
.hist-meta .legend span {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.hist-meta .legend i {
  width: 6px;
  height: 6px;
  border-radius: 1px;
  display: inline-block;
}
.hist-canvas-container {
  width: 100%;
  height: 72px;
  background: #090a0d;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  overflow: hidden;
}
#hist { width: 100%; height: 100%; display: block; }
.hist-foot {
  margin-top: 4px;
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
}

/* 手风琴折叠分组 (Accordion Sections) */
.accord-sec {
  border-bottom: 1px solid var(--border-subtle);
}
.accord-head {
  height: 32px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  background: var(--bg-panel);
  transition: background 0.12s;
}
.accord-head:hover { background: var(--bg-panel-alt); }
.accord-title {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 6px;
}
.accord-title svg {
  width: 10px;
  height: 10px;
  fill: var(--text-dim);
  transition: transform 0.15s ease;
}
.accord-sec.collapsed .accord-title svg { transform: rotate(-90deg); }
.accord-sec.collapsed .accord-body { display: none; }
.accord-body {
  padding: 4px 12px 10px;
  background: var(--bg-panel);
}

/* 精密参数调节滑块行 (Precision Param Row) */
.param-row {
  display: flex;
  align-items: center;
  height: 25px;
  gap: 8px;
}
.param-label {
  width: 62px;
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
  cursor: default;
}
.param-slider-track {
  flex: 1;
  display: flex;
  align-items: center;
}
input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  height: 2px;
  background: #2a2e38;
  border-radius: 1px;
  outline: none;
  cursor: pointer;
}
input[type=range]:hover { background: #3c4250; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #a2a8b8;
  cursor: pointer;
  transition: all 0.1s ease;
}
input[type=range]:hover::-webkit-slider-thumb {
  transform: scale(1.2);
  background: #ffffff;
  box-shadow: 0 0 5px var(--accent-glow);
}
input[type=range]:active::-webkit-slider-thumb {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

/* 紧凑数值输入框 */
.param-val {
  width: 50px;
  height: 19px;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-main);
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-align: right;
  padding: 0 4px;
  line-height: 17px;
  flex-shrink: 0;
  transition: border-color 0.12s;
}
.param-val:focus {
  border-color: var(--accent);
  color: #fff;
  background: #111419;
}

/* 下拉菜单 */
select.param-select {
  flex: 1;
  height: 22px;
  background: var(--bg-panel-alt);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-sm);
  color: var(--text-main);
  font-size: 11px;
  padding: 0 6px;
  cursor: pointer;
}
select.param-select:hover { border-color: var(--border-focus); }

/* 元数据与导出底板 */
.metadata-panel {
  padding: 8px 12px;
  background: #111215;
  border-top: 1px solid var(--border-subtle);
  font-size: 10.5px;
  font-family: var(--font-mono);
  color: var(--text-dim);
  line-height: 1.6;
}
.metadata-panel b { color: var(--text-muted); font-family: var(--font-sans); }
.sat-tag {
  display: inline-block;
  background: var(--bg-elevated);
  padding: 0 4px;
  border-radius: 2px;
  margin-right: 4px;
}

.export-control-panel {
  padding: 10px 12px;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-panel);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.dir-input-group {
  display: flex;
  gap: 4px;
}
.dir-input-group input {
  flex: 1;
  height: 24px;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-main);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 0 6px;
}

/* 通用精致按钮 */
button.btn {
  height: 24px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-medium);
  background: var(--bg-panel-alt);
  color: var(--text-main);
  font-size: 11px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  transition: all 0.12s ease;
  white-space: nowrap;
}
button.btn:hover:not(:disabled) {
  background: var(--bg-elevated);
  border-color: #4a5163;
}
button.btn:active:not(:disabled) { background: var(--bg-active); }
button.btn:disabled { opacity: 0.35; cursor: not-allowed; }

button.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
button.btn.primary:hover:not(:disabled) {
  background: #2563eb;
  border-color: #2563eb;
}
button.btn.active {
  background: var(--amber-soft);
  border-color: var(--amber);
  color: var(--amber);
}

/* 浮动 Toast 通知 */
.toast-notice {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: rgba(18, 20, 24, 0.94);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border-medium);
  color: #fff;
  font-size: 11.5px;
  padding: 6px 16px;
  border-radius: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: all 0.18s ease;
  z-index: 999;
}
.toast-notice.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<!-- 顶部应用栏 -->
<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    </div>
    <span class="brand-name">IR Studio</span>
    <span class="brand-badge">590nm RAW Pro</span>
  </div>

  <div class="header-actions">
    <button id="btnPresetExport" class="btn" title="导出当前参数为 JSON">导出预设</button>
    <button id="btnPresetImport" class="btn" title="导入外部调色预设 JSON">导入预设</button>
    <input type="file" id="filePreset" hidden accept=".json">
    <button id="btnReset" class="btn">参数全部归零</button>
  </div>

  <div class="header-meta">
    <span>保存目录:</span>
    <span class="outdir-tag" id="outdir">__OUTDIR__</span>
  </div>
</header>

<!-- 主工作区 -->
<main>
  <!-- 左侧：胶卷批次 -->
  <aside class="sidebar-left">
    <div class="section-header">
      <span>RAW 胶卷批次</span>
      <span class="badge-count" id="countBadge">0</span>
    </div>

    <div class="filmstrip-list">
      <div class="drop-box" id="drop">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <div class="t">导入 RAW 图像</div>
        <div class="s">拖拽至此或点击浏览 (多选)</div>
      </div>
      <input type="file" id="file" multiple hidden>
      <div id="list" style="display:flex;flex-direction:column;gap:5px;"></div>
    </div>

    <div style="padding:8px 10px; border-top:1px solid var(--border-subtle); display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; gap:4px;">
        <button id="btnPrev" class="btn" style="flex:1;" disabled>◀ 上一张</button>
        <button id="btnNext" class="btn" style="flex:1;" disabled>下一张 ▶</button>
      </div>
      <button id="btnAll" class="btn" disabled>全部批量导出</button>
    </div>
  </aside>

  <!-- 中央：画廊视图与视口 -->
  <section class="viewport-area">
    <div class="viewport-toolbar">
      <div class="tool-group">
        <button id="btnPick" class="btn" disabled title="快捷键: W">吸管测白</button>
        <button id="btnAuto" class="btn" disabled title="重置为全图平均白平衡">自动平均 WB</button>
        <button id="btnAutoExp" class="btn" disabled title="重新根据白平衡优化曝光">自动曝光</button>
      </div>

      <div class="tool-group">
        <button id="btnRaw" class="btn" disabled title="按住快捷键 \ 快速对比原片">对比原片</button>
      </div>

      <div style="margin-left:auto; display:flex; align-items:center; gap:6px;">
        <select id="exportMode" class="param-select" style="width:130px; height:24px;">
          <option value="developed">16-bit TIFF 成片</option>
          <option value="linear">32-bit TIFF 浮点底片</option>
          <option value="jpeg">JPG 成片</option>
        </select>
        <button id="btnJpg" class="btn" disabled title="快速保存原图尺寸 JPG">存 JPG</button>
        <button id="btnOne" class="btn primary" disabled>导出当前照片</button>
      </div>
    </div>

    <!-- 画布居中视口 -->
    <div class="viewport-canvas" id="viewport">
      <div class="empty-guide" id="hint">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        <span>从左侧拖入或点击导入 RAW 照片开始调色</span>
      </div>

      <div class="image-stage" id="stage">
        <img id="img" alt="RAW Preview">
        <div id="sel"></div>
      </div>

      <div class="badge-compare" id="compareBadge">原片对比模式 (RAW Original)</div>
      <div class="render-loading" id="spin">
        <div class="loading-pulse"></div>
        <span>渲染预览中...</span>
      </div>
    </div>

    <!-- 底部状态与快捷键 -->
    <div class="viewport-footer">
      <div>
        <span>快捷操作:</span>
        <span class="kbd">W</span> 吸管
        <span class="kbd"></span> 按住对比原片
        <span class="kbd">←</span> <span class="kbd">→</span> 切图
        <span class="kbd">双击滑块/标签</span> 快速归零
      </div>
      <div style="margin-left:auto;" id="statusTip">就绪</div>
    </div>
  </section>

  <!-- 右侧：专业参数控制台 -->
  <aside class="sidebar-right">
    <!-- RGB 三通道重叠直方图 -->
    <div class="histogram-box">
      <div class="hist-meta">
        <span>RGB 亮度直方图 (对数)</span>
        <div class="legend">
          <span><i style="background:#ef4444"></i>R</span>
          <span><i style="background:#10b981"></i>G</span>
          <span><i style="background:#3b82f6"></i>B</span>
        </div>
      </div>
      <div class="hist-canvas-container">
        <canvas id="hist" width="256" height="72"></canvas>
      </div>
      <div class="hist-foot" id="histInfo">
        <span>暗部欠曝: 0.0%</span>
        <span>高光溢出: 0.0%</span>
      </div>
    </div>

    <!-- 参数手风琴折叠控制组 -->
    <div id="accordionContainer"></div>

    <!-- 照片元数据与传感器物理饱和 -->
    <div class="metadata-panel" id="meta">
      <b>等待载入 RAW 影像数据...</b>
    </div>

    <!-- 导出路径控制 -->
    <div class="export-control-panel">
      <div style="font-size:11px;font-weight:600;color:var(--text-muted);">导出文件夹 (E 盘)</div>
      <div class="dir-input-group">
        <input id="exportDir" type="text" placeholder="输入或浏览输出文件夹路径">
        <button id="btnFolder" class="btn">浏览...</button>
      </div>
    </div>
  </aside>
</main>

<div class="toast-notice" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const imgEl=$('#img'), stage=$('#stage'), selEl=$('#sel'), spinEl=$('#spin');
const listEl=$('#list'), hintEl=$('#hint'), countBadge=$('#countBadge');

const PARAMS=[
  // 590 nm 色彩矩阵
  {k:'color_mode',g:'590 nm 色彩矩阵',lb:'色彩方案',type:'sel',opts:[
    ['reference590','公开 590 预设矩阵 (推荐)'],
    ['pastel_red','粉红树叶 · 柔和 (590 nm)'],
    ['red_foliage','红色树叶 · 鲜明 (590 nm)'],
    ['orange_foliage','橙色树叶 · 暖调 (590 nm)'],
    ['linear_brg','粉红假色 · 三通道循环'],
    ['linear_rb','线性红蓝互换 (Linear R-B)'],
    ['camera','相机矩阵 (Camera Matrix)'],
    ['classic','原始通道 (Classic Raw)'],
    ['bluegold','旧版蓝金 (Blue-Gold)']
  ]},
  {k:'color_sep',g:'590 nm 色彩矩阵',lb:'色彩分离',min:-100,max:100,step:1,dec:0,def:0},
  {k:'gold',g:'590 nm 色彩矩阵',lb:'暖色色相',min:-100,max:100,step:1,dec:0,def:0},
  {k:'blue',g:'590 nm 色彩矩阵',lb:'冷色色相',min:-100,max:100,step:1,dec:0,def:0},
  {k:'vibrance',g:'590 nm 色彩矩阵',lb:'自然饱和',min:-100,max:100,step:1,dec:0,def:0},

  // 白平衡系数
  {k:'mr',g:'白平衡增益 (WB Multipliers)',lb:'红增益 R',min:0.0001,max:10000,step:0.000001,dec:4,def:1},
  {k:'mb',g:'白平衡增益 (WB Multipliers)',lb:'蓝增益 B',min:0.0001,max:10000,step:0.000001,dec:4,def:1},

  // 基础光影
  {k:'exposure',g:'基础光影调校',lb:'曝光补偿',min:-8,max:8,step:0.05,dec:2,unit:' EV',def:0},
  {k:'contrast',g:'基础光影调校',lb:'对比度',min:-100,max:100,step:1,dec:0,def:0},
  {k:'highlights',g:'基础光影调校',lb:'高光压缩',min:0,max:100,step:1,dec:0,def:0},
  {k:'shadows',g:'基础光影调校',lb:'阴影提亮',min:0,max:100,step:1,dec:0,def:0},
  {k:'brightness',g:'基础光影调校',lb:'中间调',min:-100,max:100,step:1,dec:0,def:0},
  {k:'black',g:'基础光影调校',lb:'黑场补偿',min:0,max:100,step:1,dec:0,def:0},

  // 色调与饱和
  {k:'sat',g:'色调与饱和',lb:'全局饱和',min:0,max:200,step:1,dec:0,unit:'%',def:100},
  {k:'warm_sat',g:'色调与饱和',lb:'暖色饱和',min:-100,max:100,step:1,dec:0,unit:'%',def:0},
  {k:'cool_sat',g:'色调与饱和',lb:'冷色饱和',min:-100,max:100,step:1,dec:0,unit:'%',def:0},
  {k:'sky_light',g:'色调与饱和',lb:'天空明度',min:-100,max:100,step:1,dec:0,def:0},
  {k:'veg_light',g:'色调与饱和',lb:'植被明度',min:-100,max:100,step:1,dec:0,def:0},

  // 通道混色
  {k:'swap_mode',g:'通道混色 (Channel Swap)',lb:'互换模式',type:'sel',opts:[
    ['none','不互换 (None)'],
    ['rb','红蓝互换 (R ↔ B)'],
    ['rg','红绿互换 (R ↔ G)'],
    ['gb','绿蓝互换 (G ↔ B)'],
    ['rot','顺时针旋转 (R→B→G→R)'],
    ['rot_rev','逆时针旋转 (R→G→B→R)']
  ]},
  {k:'swap',g:'通道混色 (Channel Swap)',lb:'混色强度',min:0,max:100,step:1,dec:0,unit:'%',def:0},
  {k:'swap_hl',g:'通道混色 (Channel Swap)',lb:'高光保护',min:0,max:100,step:1,dec:0,unit:'%',def:0},

  // 细节与校正
  {k:'denoise',g:'细节与校正',lb:'降噪平滑',min:0,max:100,step:1,dec:0,def:0},
  {k:'sharpen',g:'细节与校正',lb:'细节锐化',min:0,max:150,step:1,dec:0,def:0},
  {k:'hotspot',g:'细节与校正',lb:'镜头热点',min:0,max:100,step:1,dec:0,def:0},
];

const DEF={color_mode:'reference590',color_sep:0,gold:0,blue:0,vibrance:0,brightness:0,black:0,exposure:0,highlights:0,shadows:0,contrast:0,swap_mode:'none',
  swap:0,swap_hl:0,sat:100,warm_sat:0,cool_sat:0,sky_light:0,veg_light:0,denoise:0,sharpen:0,hotspot:0};
const pv=Object.assign({},DEF,{mr:1,mb:1});

let renderVersion=0;
let items=[], cur=null, timer=null, picking=false, busy=false, showRaw=false, drag=null;

// 构建折叠分组
function buildAccordion(){
  const groups={};
  PARAMS.forEach(p=>{ (groups[p.g]=groups[p.g]||[]).push(p); });
  let html='';
  for(const g in groups){
    html+=`<div class="accord-sec">
      <div class="accord-head" onclick="this.parentElement.classList.toggle('collapsed')">
        <span class="accord-title">
          <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
          ${g}
        </span>
      </div>
      <div class="accord-body">`;
    
    groups[g].forEach(p=>{
      if(p.type==='sel'){
        html+=`<div class="param-row">
          <span class="param-label">${p.lb}</span>
          <select class="param-select" id="s_${p.k}">
            ${p.opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}
          </select>
        </div>`;
      } else {
        html+=`<div class="param-row">
          <span class="param-label" title="双击重置默认值" ondblclick="resetParam('${p.k}')">${p.lb}</span>
          <div class="param-slider-track">
            <input type="range" id="s_${p.k}" min="${p.min}" max="${p.max}" step="${p.step}" ondblclick="resetParam('${p.k}')">
          </div>
          <input class="param-val" id="v_${p.k}" type="text">
        </div>`;
      }
    });
    html+=`</div></div>`;
  }
  $('#accordionContainer').innerHTML=html;

  // 绑定事件
  PARAMS.forEach(p=>{
    const el=$('#s_'+p.k);
    if(!el) return;
    if(p.type==='sel'){
      el.addEventListener('change',()=>{
        pv[p.k]=el.value;
        if(p.k==='color_mode'){
          pv.swap_mode='none'; pv.swap=0;
          Object.assign(pv, el.value==='bluegold'?{color_sep:60,gold:85,blue:85,vibrance:35}:{color_sep:0,gold:0,blue:0,vibrance:0});
          syncAll();
        }
        schedule();
      });
    } else {
      el.addEventListener('input',()=>{
        pv[p.k]=parseFloat(el.value);
        syncLabel(p);
        schedule();
      });

      const vEl=$('#v_'+p.k);
      vEl.addEventListener('change',()=>{
        let num=parseFloat(vEl.value);
        if(!isNaN(num)){
          if(p.k==='mr'||p.k==='mb') num=Math.max(0.0001, Math.min(10000, num));
          else num=Math.max(p.min, Math.min(p.max, num));
          pv[p.k]=num;
          syncAll();
          schedule();
        } else {
          syncLabel(p);
        }
      });
    }
  });
}

function resetParam(k){
  const p=PARAMS.find(x=>x.k===k);
  if(!p) return;
  if(k==='mr'||k==='mb'){
    pv[k]=(cur!==null && items[cur].data)?items[cur].data.mul[k==='mr'?'R':'B']:1;
  } else {
    pv[k]=(p.def!==undefined)?p.def:DEF[k];
  }
  syncAll();
  schedule();
  toast(`已复位 ${p.lb}`, 1600);
}

function syncLabel(p){
  const el=$('#v_'+p.k);
  if(el){
    if(p.k==='mr'||p.k==='mb') el.value=pv[p.k].toFixed(4);
    else el.value=pv[p.k].toFixed(p.dec) + (p.unit||'');
  }
}

function syncAll(){
  PARAMS.forEach(p=>{
    const el=$('#s_'+p.k); if(!el) return;
    if(p.k==='mr'||p.k==='mb'){
      const v=pv[p.k];
      el.min=Math.max(0.0001, v*0.5);
      el.max=Math.min(10000, v*1.5);
      el.step=Math.max(0.000001, (el.max-el.min)/2000);
    }
    if(['color_sep','gold','blue','vibrance'].includes(p.k)){
      el.min=pv.color_mode==='bluegold'?0:-100;
    }
    el.value=pv[p.k];
    if(p.type!=='sel') syncLabel(p);
  });
}

function toast(m, ms=2500){
  const t=$('#toast');
  t.textContent=m;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h=setTimeout(()=>t.classList.remove('show'), ms);
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 文件上传
async function upload(file){
  const idx=items.length;
  const item=document.createElement('div');
  item.className='raw-item';
  item.innerHTML=`
    <div class="raw-thumb">
      <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
    </div>
    <div class="raw-detail">
      <div class="raw-name">${esc(file.name)}</div>
      <div class="raw-sub">读取解算中...</div>
    </div>
  `;
  listEl.appendChild(item);
  items.push({name:file.name, el:item, data:null, thumbUrl:null});
  item.onclick=()=>select(idx);
  countBadge.textContent=items.length;

  try{
    const res=await fetch('/api/analyze',{
      method:'POST',
      headers:{'X-Filename':encodeURIComponent(file.name)},
      body:file
    });
    const j=await res.json();
    if(!res.ok) throw new Error(j.error||('HTTP '+res.status));
    items[idx].data=j;

    item.querySelector('.raw-sub').innerHTML=`${esc(j.meta.cfa)} · <b>R ${j.mul.R.toFixed(2)}  B ${j.mul.B.toFixed(2)}</b>`;
    if(cur===null||cur===idx) select(idx);
  }catch(e){
    item.classList.add('error');
    item.querySelector('.raw-sub').textContent='解析失败：'+(e.message||'未知错误');
    item.querySelector('.raw-sub').title=e.message||'未知错误';
    toast('导入失败：'+(e.message||'未知错误'), 5000);
  }
}

function saveCurrent(){
  if(cur!==null && items[cur] && items[cur].data){
    items[cur].settings={...pv};
  }
}

function select(i){
  if(i<0 || i>=items.length) return;
  saveCurrent();
  cur=i;
  items.forEach((it,k)=>it.el.classList.toggle('active', k===i));
  const d=items[i].data; if(!d) return;

  pv.mr=d.mul.R; pv.mb=d.mul.B;
  Object.assign(pv, DEF, {mr:d.mul.R, mb:d.mul.B}, items[i].settings||{});
  syncAll();

  showRaw=false;
  $('#btnRaw').classList.remove('active');
  $('#compareBadge').classList.remove('active');

  ['#btnPick','#btnAuto','#btnAutoExp','#btnRaw','#btnOne','#btnJpg'].forEach(s=>$(s).disabled=false);
  $('#btnPrev').disabled=(i<=0);
  $('#btnNext').disabled=(i>=items.length-1);
  $('#btnAll').disabled=!items.some(x=>x.data);

  stage.classList.add('show');
  hintEl.style.display='none';
  setPicking(false);
  render(true);

  // 更新元数据
  const m=d.meta;
  const sensInfo = Object.entries(m.sensor_channels||{})
    .map(([c,v])=>`<span class="sat-tag">${c}: ${v.saturated_percent.toFixed(2)}%</span>`).join('');

  $('#meta').innerHTML=`
    <div style="font-weight:600;color:var(--text-main);margin-bottom:4px;">${esc(d.name)}</div>
    <div>CFA: ${esc(m.cfa)} | 分辨率: ${m.size[0]}×${m.size[1]}</div>
    <div>电平: 白 ${m.white} / 黑 ${m.black.join('/')}</div>
    <div style="margin-top:4px;">传感器饱和: ${sensInfo}</div>
  `;
}

function query(){
  return PARAMS.map(p=>p.k+'='+encodeURIComponent(pv[p.k])).join('&');
}

function render(force){
  const d=cur===null?null:items[cur].data; if(!d) return;
  const q = showRaw ? 'mr=1&mb=1&color_mode=classic' : query();
  spinEl.classList.add('active');
  const version=++renderVersion;
  const tmp=new Image();
  tmp.onload=()=>{
    if(version!==renderVersion) return;
    imgEl.src=tmp.src;
    drawHistogram(tmp);
    spinEl.classList.remove('active');
    if(items[cur] && !items[cur].thumbUrl){
      items[cur].thumbUrl=tmp.src;
      items[cur].el.querySelector('.raw-thumb').innerHTML=`<img src="${tmp.src}">`;
    }
  };
  tmp.onerror=()=>{
    if(version!==renderVersion) return;
    spinEl.classList.remove('active');
    toast('渲染失败');
  };
  tmp.src='/api/render?fid='+d.fid+'&'+q+'&t='+Date.now();
}

function drawHistogram(img){
  const sample=document.createElement('canvas');
  sample.width=256;
  sample.height=Math.max(1,Math.round(256*img.naturalHeight/img.naturalWidth));
  const s=sample.getContext('2d',{willReadFrequently:true});
  s.drawImage(img,0,0,sample.width,sample.height);
  const pixels=s.getImageData(0,0,sample.width,sample.height).data;
  
  const rBins=new Uint32Array(256), gBins=new Uint32Array(256), bBins=new Uint32Array(256);
  let dark=0, bright=0;
  for(let i=0; i<pixels.length; i+=4){
    const r=pixels[i], g=pixels[i+1], b=pixels[i+2];
    rBins[r]++; gBins[g]++; bBins[b]++;
    const y=Math.round(0.2126*r + 0.7152*g + 0.0722*b);
    if(y<=5) dark++;
    if(y>=250) bright++;
  }
  const n=pixels.length/4;
  const c=$('#hist'), ctx=c.getContext('2d');
  ctx.clearRect(0,0,256,72);

  const maxVal=Math.max(1, ...rBins, ...gBins, ...bBins);

  function plotChan(bins, color){
    ctx.strokeStyle=color;
    ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=0;x<256;x++){
      const h=66*Math.log1p(bins[x])/Math.log1p(maxVal);
      if(x===0) ctx.moveTo(x, 72-h);
      else ctx.lineTo(x, 72-h);
    }
    ctx.stroke();
  }

  ctx.globalCompositeOperation='screen';
  plotChan(rBins, 'rgba(239, 68, 68, 0.75)');
  plotChan(gBins, 'rgba(16, 185, 129, 0.75)');
  plotChan(bBins, 'rgba(59, 130, 246, 0.75)');
  ctx.globalCompositeOperation='source-over';

  $('#histInfo').innerHTML=`
    <span>暗部欠曝: <b style="color:${dark/n>0.05?'var(--danger)':'var(--text-muted)'}">${(100*dark/n).toFixed(1)}%</b></span>
    <span>高光溢出: <b style="color:${bright/n>0.05?'var(--danger)':'var(--text-muted)'}">${(100*bright/n).toFixed(1)}%</b></span>
  `;
}

function schedule(){
  saveCurrent();
  clearTimeout(timer);
  timer=setTimeout(()=>render(false), 160);
}

// 吸管
function setPicking(on){
  picking=on;
  stage.classList.toggle('crosshair', on);
  $('#btnPick').classList.toggle('active', on);
  $('#statusTip').textContent = on ? '吸管模式开启：在画面中框选白色或中性灰区域' : '就绪';
}
$('#btnPick').onclick=()=>setPicking(!picking);

$('#btnAuto').onclick=()=>{
  if(cur===null || !items[cur].data) return;
  const d=items[cur].data;
  pv.mr=d.mul.R; pv.mb=d.mul.B; showRaw=false;
  syncAll(); render(true);
  toast('已恢复平均白平衡');
};

$('#btnAutoExp').onclick=async()=>{
  if(cur===null || !items[cur].data) return;
  const d=items[cur].data;
  spinEl.classList.add('active');
  try{
    const r=await fetch('/api/autoscale?fid='+d.fid+'&mr='+pv.mr+'&mb='+pv.mb);
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    pv.exposure=0; syncAll(); render(true);
    toast('曝光基准已重新优化');
  }catch(e){ toast('自动曝光失败: '+e.message); }
  finally{ spinEl.classList.remove('active'); }
};

// 对比原图
function toggleCompare(forceVal){
  showRaw = (forceVal !== undefined) ? forceVal : !showRaw;
  $('#btnRaw').classList.toggle('active', showRaw);
  $('#compareBadge').classList.toggle('active', showRaw);
  render(true);
}
$('#btnRaw').onclick=()=>toggleCompare();

// 键盘快捷键
window.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT' || e.target.tagName==='SELECT') return;
  if(e.key==='\\' || e.key==='|'){ if(!showRaw) toggleCompare(true); }
  else if(e.key==='w' || e.key==='W'){ setPicking(!picking); }
  else if(e.key==='[' || e.key==='ArrowLeft'){ if(cur>0) select(cur-1); }
  else if(e.key===']' || e.key==='ArrowRight'){ if(cur<items.length-1) select(cur+1); }
});
window.addEventListener('keyup', e=>{
  if(e.key==='\\' || e.key==='|'){ if(showRaw) toggleCompare(false); }
});

$('#btnPrev').onclick=()=>{ if(cur>0) select(cur-1); };
$('#btnNext').onclick=()=>{ if(cur<items.length-1) select(cur+1); };

$('#btnReset').onclick=()=>{
  Object.keys(DEF).forEach(k=>pv[k]=DEF[k]);
  const d=cur===null?null:items[cur].data;
  if(d){ pv.mr=d.mul.R; pv.mb=d.mul.B; }
  syncAll(); render(true);
  toast('全部参数已归零');
};

// 预设导出/导入
$('#btnPresetExport').onclick=()=>{
  saveCurrent();
  const blob=new Blob([JSON.stringify(pv, null, 2)], {type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ir_preset_' + (items[cur]?items[cur].name.replace(/\.[^.]+$/, ''):'custom') + '.json';
  a.click();
  toast('预设 JSON 已导出');
};
$('#btnPresetImport').onclick=()=>$('#filePreset').click();
$('#filePreset').onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const imported=JSON.parse(reader.result);
      Object.assign(pv, imported);
      syncAll();
      render(true);
      toast('调色预设导入成功！');
    }catch(err){ toast('预设解析失败'); }
  };
  reader.readAsText(f);
  e.target.value='';
};

// 选区吸管
function rectOf(e){
  const r=imgEl.getBoundingClientRect();
  return {
    x: Math.min(Math.max((e.clientX-r.left)/r.width, 0), 1),
    y: Math.min(Math.max((e.clientY-r.top)/r.height, 0), 1)
  };
}
function showSel(a,b){
  const r=imgEl.getBoundingClientRect(), host=stage.getBoundingClientRect();
  const x0=Math.min(a.x,b.x)*r.width, x1=Math.max(a.x,b.x)*r.width;
  const y0=Math.min(a.y,b.y)*r.height, y1=Math.max(a.y,b.y)*r.height;
  selEl.style.display='block';
  selEl.style.left=(r.left-host.left+x0)+'px';
  selEl.style.top=(r.top-host.top+y0)+'px';
  selEl.style.width=Math.max(2,x1-x0)+'px';
  selEl.style.height=Math.max(2,y1-y0)+'px';
}

stage.addEventListener('mousedown',e=>{
  if(!picking) return;
  e.preventDefault();
  drag=rectOf(e); showSel(drag,drag);
});
window.addEventListener('mousemove',e=>{
  if(!drag||!picking) return;
  showSel(drag, rectOf(e));
});
window.addEventListener('mouseup',async e=>{
  if(!drag||!picking) return;
  const b=rectOf(e), a=drag; drag=null;
  selEl.style.display='none';
  const x0=Math.min(a.x,b.x), x1=Math.max(a.x,b.x);
  const y0=Math.min(a.y,b.y), y1=Math.max(a.y,b.y);
  if((x1-x0)*imgEl.clientWidth<4 || (y1-y0)*imgEl.clientHeight<4){
    toast('框选区域过小，请重新框选'); return;
  }
  const d=items[cur].data;
  spinEl.classList.add('active');
  try{
    const res=await fetch(`/api/probe?fid=${d.fid}&x0=${x0}&y0=${y0}&x1=${x1}&y1=${y1}`);
    const j=await res.json();
    if(!res.ok) throw new Error(j.error||('HTTP '+res.status));
    pv.mr=j.mul.R; pv.mb=j.mul.B;
    syncAll(); render(true);
    let msg=`取白成功: R ${j.mul.R.toFixed(3)}  B ${j.mul.B.toFixed(3)}`;
    if(j.level>0.92) toast(msg+' (区域偏亮接近过曝)', 4000);
    else if(j.level<0.04) toast(msg+' (区域偏暗噪点大)', 4000);
    else toast(msg, 2500);
    setPicking(false);
  }catch(err){ toast('取白失败: '+err.message); }
  finally{ spinEl.classList.remove('active'); }
});

// 导出
async function exportOne(i, mode=$('#exportMode').value){
  saveCurrent();
  const d=items[i].data;
  const settings=items[i].settings||{...DEF, mr:d.mul.R, mb:d.mul.B};
  const q=new URLSearchParams(settings).toString();
  const res=await fetch(`/api/export?fid=${d.fid}&${q}&mode=${encodeURIComponent(mode)}&outdir=${encodeURIComponent($('#exportDir').value.trim())}`, {method:'POST'});
  const j=await res.json();
  if(!res.ok) throw new Error(j.error||('HTTP '+res.status));
  return j.path;
}

$('#btnJpg').onclick=async()=>{
  if(busy || cur===null || !items[cur].data) return;
  busy=true;
  const b=$('#btnJpg'); b.disabled=true; b.textContent='导出中...';
  try{
    const p=await exportOne(cur, 'jpeg');
    toast(`JPG 保存成功: ${p}`, 4500);
  }catch(e){ toast('JPG 导出失败: '+e.message); }
  finally{ b.disabled=false; b.textContent='存 JPG'; busy=false; }
};

$('#btnOne').onclick=async()=>{
  if(busy || cur===null || !items[cur].data) return;
  busy=true;
  const b=$('#btnOne'); b.disabled=true; b.textContent='导出中...';
  try{
    const p=await exportOne(cur);
    toast(`导出成功: ${p}`, 4500);
  }catch(e){ toast('导出失败: '+e.message); }
  finally{ b.disabled=false; b.textContent='导出当前照片'; busy=false; }
};

$('#btnAll').onclick=async()=>{
  if(busy) return;
  busy=true;
  const b=$('#btnAll'); b.disabled=true;
  const todo=items.map((it,i)=>[it,i]).filter(([it])=>it.data);
  let ok=0;
  for(let k=0; k<todo.length; k++){
    b.textContent=`导出中 (${k+1}/${todo.length})`;
    try{ await exportOne(todo[k][1]); ok++; }catch(e){}
  }
  b.textContent='全部批量导出'; b.disabled=false; busy=false;
  toast(`批量导出完成: ${ok}/${todo.length} 张照片`, 4000);
};

// 拖拽
const drop=$('#drop');
drop.onclick=()=>$('#file').click();
$('#file').onchange=e=>{ [...e.target.files].forEach(upload); e.target.value=''; };
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{
  e.preventDefault(); e.stopPropagation(); drop.classList.add('drag-over'); }));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{
  e.preventDefault(); e.stopPropagation(); drop.classList.remove('drag-over'); }));
drop.addEventListener('drop',e=>{ [...e.dataTransfer.files].forEach(upload); });
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{
  e.preventDefault();
  if(e.target.closest && e.target.closest('#drop')) return;
  [...e.dataTransfer.files].forEach(upload);
});

// 输出文件夹
$('#exportDir').value=localStorage.getItem('irExportDir')||$('#outdir').textContent;
$('#exportDir').addEventListener('change',()=>localStorage.setItem('irExportDir', $('#exportDir').value.trim()));
$('#btnFolder').onclick=async()=>{
  const b=$('#btnFolder'); b.disabled=true;
  try{
    const r=await fetch('/api/folder', {method:'POST'});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error);
    if(j.path){
      $('#exportDir').value=j.path;
      localStorage.setItem('irExportDir', j.path);
    }
  }catch(e){ toast('打开文件夹失败: '+e.message); }
  finally{ b.disabled=false; }
};

buildAccordion();
syncAll();
</script>
